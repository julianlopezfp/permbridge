# ILLUSTRATIVE ONLY: no YAML parser or agent adapter exists yet.
version: 1

policy:
  defaults:
    decision: ask

  filesystem:
    read:
      decision: allow
    write:
      decision: ask
    outside_workspace:
      decision: deny

  network:
    default:
      decision: ask
    domains: []

  execution:
    default:
      decision: ask
    rules: []

validation:
  fail_on:
    - less_restrictive
    - unsupported

targets:
  - codex
  - claude-code
